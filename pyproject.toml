[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-rate"
version = "1.0.0"
description = "Freight rate prediction: data audit, time-aware validation and a hybrid trend + GBM model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
